<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Azota</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            color: #1e3a8a;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .language-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 14px;
            transition: color 0.3s;
        }

        .language-btn:hover {
            color: #1e3a8a;
        }

        .flag {
            width: 24px;
            height: 16px;
            border-radius: 3px;
        }

        .time-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 14px;
            transition: color 0.3s;
        }

        .time-btn:hover {
            color: #1e3a8a;
        }

        /* Register Container */
        .register-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            width: 100%;
            max-width: 600px;
            margin-top: 60px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-align: center;
        }

        .register-subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 40px;
        }

        /* Role Selection */
        .role-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .role-card {
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-input {
            display: none;
        }

        .role-card-content {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s;
            background: white;
        }

        .role-card input:checked ~ .role-card-content {
            border-color: #1e3a8a;
            background: #f0f4ff;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }

        .role-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .role-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .role-card input:checked ~ .role-card-content .role-name {
            color: #1e3a8a;
        }

        .checkmark {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .role-card input:checked ~ .role-card-content ~ .checkmark {
            border-color: #1e3a8a;
            background: #1e3a8a;
            color: white;
        }

        /* Form Groups */
        .form-section {
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: #1a1a1a;
            transition: all 0.3s;
            background: #f9fafb;
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .form-input:focus {
            outline: none;
            border-color: #1e3a8a;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .agreement-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }

        .agreement-input {
            width: 18px;
            height: 18px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            accent-color: #1e3a8a;
        }

        .agreement-text {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .agreement-link {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .agreement-link:hover {
            color: #1e40af;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-back {
            background: #f3f4f6;
            color: #666;
        }

        .btn-back:hover {
            background: #e5e7eb;
        }

        .btn-next {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.4);
        }

        .btn-next:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            padding: 14px;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30, 58, 138, 0.4);
        }

        /* Messages */
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress */
        .progress-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            position: relative;
        }

        .progress-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            z-index: -1;
        }

        .progress-step.active:not(:last-child)::after {
            background: #1e3a8a;
        }

        .progress-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .progress-step.active .progress-dot {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        .progress-step.completed .progress-dot {
            background: #10b981;
            border-color: #10b981;
        }

        .progress-label {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .progress-step.active .progress-label {
            color: #1e3a8a;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }

            .register-container {
                padding: 30px 20px;
                margin-top: 70px;
            }

            .register-title {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column-reverse;
            }

            .progress-indicator {
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="#" class="logo">
            <div class="logo-icon">Δ</div>
            <span>Azota</span>
        </a>
        <div class="header-right">
            <button class="language-btn">
                <svg class="flag" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
                    <rect width="900" height="300" fill="#CE1126"/>
                    <rect y="300" width="900" height="300" fill="#FFC400"/>
                </svg>
                <span>Tiếng Việt</span>
            </button>
            <button class="time-btn">
                <span>🌙</span>
                <span>Chế độ tối</span>
            </button>
        </div>
    </div>

    <!-- Register Container -->
    <div class="register-container">
        <h1 class="register-title">Đăng ký</h1>
        <p class="register-subtitle">Chọn vai trò của bạn để bắt đầu</p>

        <!-- Progress Indicator -->
        <div class="progress-indicator">
            <div class="progress-step active" id="step1">
                <div class="progress-dot">1</div>
                <div class="progress-label">Chọn vai trò</div>
            </div>
            <div class="progress-step" id="step2">
                <div class="progress-dot">2</div>
                <div class="progress-label">Thông tin</div>
            </div>
            <div class="progress-step" id="step3">
                <div class="progress-dot">3</div>
                <div class="progress-label">Xác nhận</div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Step 1: Role Selection -->
        <div class="form-section active" id="roleSection">
            <div class="role-selection">
                <!-- Student Role -->
                <label class="role-card">
                    <input type="radio" name="role" value="student" class="role-input" onchange="selectRole('student')">
                    <div class="role-card-content">
                        <div class="role-icon">🎓</div>
                        <div class="role-name">Tôi là học sinh</div>
                    </div>
                    <div class="checkmark">✓</div>
                </label>

                <!-- Teacher Role -->
                <label class="role-card">
                    <input type="radio" name="role" value="teacher" class="role-input" onchange="selectRole('teacher')">
                    <div class="role-card-content">
                        <div class="role-icon">👨‍🏫</div>
                        <div class="role-name">Tôi là giáo viên</div>
                    </div>
                    <div class="checkmark">✓</div>
                </label>
            </div>

            <button class="btn btn-next" id="nextBtn1" onclick="nextStep(2)" disabled>
                Tiếp tục →
            </button>
        </div>

        <!-- Step 2: Personal Information -->
        <form class="form-section" id="infoSection">
            <div class="form-group">
                <label class="form-label">Họ và tên *</label>
                <input type="text" class="form-input" id="fullName" placeholder="Nhập họ và tên của bạn" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" class="form-input" id="email" placeholder="Nhập địa chỉ email" required>
            </div>

            <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" class="form-input" id="phone" placeholder="Nhập số điện thoại (tùy chọn)">
            </div>

            <div class="form-group" id="schoolGroup" style="display: none;">
                <label class="form-label">Trường học *</label>
                <input type="text" class="form-input" id="school" placeholder="Tên trường của bạn">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu *</label>
                <input type="password" class="form-input" id="password" placeholder="Tối thiểu 8 ký tự" required>
            </div>

            <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu *</label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-back" onclick="previousStep(1)">← Quay lại</button>
                <button type="button" class="btn btn-next" onclick="nextStep(3)">Tiếp tục →</button>
            </div>
        </form>

        <!-- Step 3: Confirmation -->
        <form class="form-section" id="confirmSection">
            <div class="agreement-group">
                <input type="checkbox" class="agreement-input" id="termsCheck" required>
                <div class="agreement-text">
                    Tôi đồng ý với <a href="#" class="agreement-link">Điều khoản dịch vụ</a> và <a href="#" class="agreement-link">Chính sách bảo mật</a>
                </div>
            </div>

            <div class="agreement-group">
                <input type="checkbox" class="agreement-input" id="marketingCheck">
                <div class="agreement-text">
                    Tôi muốn nhận thông báo về các khóa học và cập nhật mới từ Azota
                </div>
            </div>

            <div style="background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p style="font-size: 13px; color: #666; margin-bottom: 8px;"><strong>Tóm tắt:</strong></p>
                <p style="font-size: 13px; color: #666; margin-bottom: 4px;" id="summaryRole">Vai trò: <span id="summaryRoleValue">-</span></p>
                <p style="font-size: 13px; color: #666;" id="summaryEmail">Email: <span id="summaryEmailValue">-</span></p>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-back" onclick="previousStep(2)">← Quay lại</button>
                <button type="button" class="btn btn-register" onclick="handleRegister()">Tạo tài khoản</button>
            </div>
        </form>
    </div>

    <script>
        let currentStep = 1;
        let selectedRole = null;

        // Select role and enable next button
        function selectRole(role) {
            selectedRole = role;
            document.getElementById('nextBtn1').disabled = false;
            
            // Show school field only for students
            if (role === 'student') {
                document.getElementById('schoolGroup').style.display = 'block';
            } else {
                document.getElementById('schoolGroup').style.display = 'none';
            }
        }

        // Move to next step
        function nextStep(stepNumber) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.classList.remove('show');

            if (stepNumber === 2) {
                if (!selectedRole) {
                    showError('Vui lòng chọn vai trò của bạn');
                    return;
                }
                goToStep(2);
            } else if (stepNumber === 3) {
                if (!validateStep2()) {
                    return;
                }
                updateSummary();
                goToStep(3);
            }
        }

        // Move to previous step
        function previousStep(stepNumber) {
            goToStep(stepNumber);
        }

        // Go to specific step
        function goToStep(stepNumber) {
            // Hide all sections
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });

            // Show selected section
            if (stepNumber === 1) {
                document.getElementById('roleSection').classList.add('active');
            } else if (stepNumber === 2) {
                document.getElementById('infoSection').classList.add('active');
            } else if (stepNumber === 3) {
                document.getElementById('confirmSection').classList.add('active');
            }

            // Update progress
            updateProgress(stepNumber);
            currentStep = stepNumber;
        }

        // Update progress indicator
        function updateProgress(stepNumber) {
            document.querySelectorAll('.progress-step').forEach((step, index) => {
                step.classList.remove('active', 'completed');
                if (index + 1 < stepNumber) {
                    step.classList.add('completed');
                } else if (index + 1 === stepNumber) {
                    step.classList.add('active');
                }
            });
        }

        // Validate step 2
        function validateStep2() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!fullName) {
                showError('Vui lòng nhập họ và tên');
                return false;
            }

            if (!email) {
                showError('Vui lòng nhập email');
                return false;
            }

            if (!validateEmail(email)) {
                showError('Email không hợp lệ');
                return false;
            }

            if (!password) {
                showError('Vui lòng nhập mật khẩu');
                return false;
            }

            if (password.length < 8) {
                showError('Mật khẩu phải có ít nhất 8 ký tự');
                return false;
            }

            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp');
                return false;
            }

            return true;
        }

        // Validate email
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Update summary
        function updateSummary() {
            const roleText = selectedRole === 'student' ? 'Học sinh' : 'Giáo viên';
            document.getElementById('summaryRoleValue').textContent = roleText;
            document.getElementById('summaryEmailValue').textContent = document.getElementById('email').value;
        }

        // Show error
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Show success
        function showSuccess(message) {
            const successMessage = document.getElementById('successMessage');
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        // Handle register
        function handleRegister() {
            const termsCheck = document.getElementById('termsCheck').checked;

            if (!termsCheck) {
                showError('Vui lòng đồng ý với Điều khoản dịch vụ');
                return;
            }

            // Simulate registration
            const registerBtn = event.target;
            registerBtn.disabled = true;
            registerBtn.textContent = 'Đang tạo tài khoản...';

            setTimeout(() => {
                showSuccess('Tài khoản đã được tạo thành công! Chuyển hướng đến đăng nhập...');
                
                setTimeout(() => {
                    window.location.href = '#login';
                }, 2000);
            }, 1500);
        }

        // Language switch
        document.querySelector('.language-btn').addEventListener('click', function() {
            alert('Chuyển ngôn ngữ - Tính năng đang phát triển');
        });

        // Dark mode toggle
        document.querySelector('.time-btn').addEventListener('click', function() {
            document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'none' : 'invert(1)';
        });

        // Logo link
        document.querySelector('.logo').addEventListener('click', function(e) {
            e.preventDefault();
            goToStep(1);
        });
    </script>
</body>
</html>
