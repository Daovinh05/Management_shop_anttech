services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080/Banhang/}"
      DB_HOST: db
      DB_NAME: "${DB_NAME:-banhang}"
      DB_USER: "${DB_USER:-banhang}"
      DB_PASS: "${DB_PASS:-banhang_secret}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: "${DB_NAME:-banhang}"
      MARIADB_USER: "${DB_USER:-banhang}"
      MARIADB_PASSWORD: "${DB_PASS:-banhang_secret}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASS:-root_secret}"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "${DB_ROOT_PASS:-root_secret}"
      UPLOAD_LIMIT: 128M
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
