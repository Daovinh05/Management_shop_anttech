<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - VNPAY Payment Demo</title>
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #f4f4f4; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 500px; 
        }
        h1 { color: #333; margin-bottom: 20px; }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #555; 
            font-weight: bold;
        }
        input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 16px;
            box-sizing: border-box;
        }
        button { 
            background: #00483d; 
            color: white; 
            padding: 12px 25px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }
        button:hover { 
            background: #00332c; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thanh toán với VNPAY</h1>
        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Số tiền thanh toán (VND):</label>
                <input type="number" id="amount" name="amount" value="10000" min="1000" step="1000" required>
            </div>
            <button type="submit">Thanh toán ngay</button>
        </form>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            
            try {
                const response = await fetch('http://localhost:3000/api/create-qr', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ amount: parseInt(amount) })
                });
                
                const data = await response.json();
                
                if(data.paymentUrl) {
                    // Redirect to VNPAY
                    window.location.href = data.paymentUrl;
                } else {
                    alert('Có lỗi xảy ra khi tạo liên kết thanh toán');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Có lỗi xảy ra khi tạo liên kết thanh toán');
            }
        });
    </script>
</body>
</html>
