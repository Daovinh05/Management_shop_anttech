<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Trang chủ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-black: #000000;
            --text-gray: #888;
            --tech-blue: #0071e3;
            --sale-red: #d70018;
            --header-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            background-color: #f5f5f7;
        }

        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0px #eee;
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
        }

        .logo span {
            color: var(--tech-blue);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
        }

        .nav-item {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--tech-blue);
            color: white;
        }

        .btn-outline {
            border: 1px solid var(--tech-blue);
            color: var(--tech-blue);
        }

        main {
            padding: 40px;
            min-height: calc(100vh - var(--header-height) - 60px);
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin-bottom: 40px;
            color: white;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .products-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--tech-blue);
        }

        .product-old-price {
            font-size: 14px;
            text-decoration: line-through;
            color: var(--text-gray);
            margin-left: 10px;
        }

        footer {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 40px;
            text-align: center;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <header>
        <a href="/banhang/home" class="logo">Tech<span>Zone</span></a>
        
        <nav class="nav-menu">
            <a href="/banhang/home" class="nav-item">Trang chủ</a>
            <a href="/banhang/khachhang" class="nav-item">Sản phẩm</a>
            <a href="#" class="nav-item">Khuyến mãi</a>
            <a href="#" class="nav-item">Giới thiệu</a>
            <a href="#" class="nav-item">Liên hệ</a>
        </nav>
        
        <div class="nav-actions">
            <a href="/banhang/login" class="btn btn-outline">Đăng nhập</a>
            <a href="/banhang/register" class="btn btn-primary">Đăng ký</a>
        </div>
    </header>

    <main>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="hero">
            <h1>Chào mừng đến với TechZone</h1>
            <p>Điện thoại & Laptop Chính Hãng - Giá Tốt Nhất</p>
        </div>

        <div class="products-section">
            <h2 class="section-title">Sản Phẩm Nổi Bật</h2>
            
            <div class="products-grid">
                <div class="product-card" th:each="sp : ${dssp}" th:if="${#lists.size(dssp) > 0}">
                    <img th:src="@{/images/products/{img}(img=${sp.maSanPham} + '.jpg')}" 
                         alt="Product" 
                         class="product-image"
                         onerror="this.src='https://via.placeholder.com/300x250?text=No+Image'">
                    
                    <h3 class="product-name" th:text="${sp.tenSanPham}">Tên sản phẩm</h3>
                    
                    <div class="product-price">
                        <span th:text="${#numbers.formatCurrency(sp.bienTheList != null && !sp.bienTheList.isEmpty() ? sp.bienTheList[0].gia : 0)}">0₫</span>
                    </div>
                </div>
                
                <div th:if="${#lists.size(dssp) == 0}" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <p style="font-size: 18px; color: #888;">Chưa có sản phẩm nào</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TechZone. Tất cả quyền được bảo lưu.</p>
    </footer>
</body>
</html>
