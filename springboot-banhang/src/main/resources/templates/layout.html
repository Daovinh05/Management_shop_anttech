<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Hệ Thống Bán Lẻ Di Động Chính Hãng</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-black: #000000;
            --text-gray: #888;
            --tech-blue: #0071e3;
            --sale-red: #d70018;
            --header-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            background-color: #f5f5f7;
            overflow-x: hidden;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
        }

        /* Header */
        header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0px #eee;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--tech-blue);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-item {
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #333;
            text-decoration: none;
        }

        .nav-item:hover {
            color: var(--tech-blue);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--tech-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #005bb5;
        }

        .btn-outline {
            border: 1px solid var(--tech-blue);
            color: var(--tech-blue);
        }

        .btn-outline:hover {
            background: var(--tech-blue);
            color: white;
        }

        /* Main Content */
        main {
            min-height: calc(100vh - var(--header-height) - 60px);
            padding: 40px;
        }

        /* Footer */
        footer {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 40px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .footer-links a {
            color: #f5f5f7;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: var(--tech-blue);
        }

        /* Alert messages */
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
    
    <th:block th:replace="${extraCss} ?: _"></th:block>
</head>

<body>
    <header>
        <a href="/banhang/home" class="logo">Tech<span>Zone</span></a>
        
        <nav class="nav-menu">
            <a href="/banhang/home" class="nav-item">Trang chủ</a>
            <a href="/banhang/khachhang" class="nav-item">Sản phẩm</a>
            <a href="#" class="nav-item">Khuyến mãi</a>
            <a href="#" class="nav-item">Giới thiệu</a>
            <a href="#" class="nav-item">Liên hệ</a>
        </nav>
        
        <div class="nav-actions">
            <a href="/banhang/khachhang/giohang" class="nav-item">
                🛒 Giỏ hàng
            </a>
            
            <div sec:authorize="isAnonymous()">
                <a href="/banhang/login" class="btn btn-outline">Đăng nhập</a>
                <a href="/banhang/register" class="btn btn-primary">Đăng ký</a>
            </div>
            
            <div sec:authorize="isAuthenticated()">
                <span class="nav-item" sec:authentication="name"></span>
                <a href="/banhang/logout" class="btn btn-outline">Đăng xuất</a>
                
                <a sec:authorize="hasRole('admin')" href="/banhang/admin" class="btn btn-primary">Admin</a>
            </div>
        </div>
    </header>

    <main>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
        
        <th:block th:replace="${content} ?: _"></th:block>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#">Về chúng tôi</a>
            <a href="#">Điều khoản sử dụng</a>
            <a href="#">Chính sách bảo mật</a>
            <a href="#">Chính sách giao hàng</a>
            <a href="#">Hướng dẫn mua hàng</a>
        </div>
        <p>&copy; 2026 TechZone. Tất cả quyền được bảo lưu.</p>
    </footer>
    
    <th:block th:replace="${extraJs} ?: _"></th:block>
</body>
</html>
